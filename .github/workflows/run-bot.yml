name: Run Bot Discord

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: run-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          repository: huydepayqiu119-cpu/bot-discord
          token: ${{ secrets.BOTDISCORD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null 2>&1
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
          sudo apt-get update -qq > /dev/null 2>&1 && sudo apt-get install -y ngrok > /dev/null 2>&1

      - name: Start bot and stream logs
        run: |
          tg_json() {
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"$TELEGRAM_CHAT_ID\",\"parse_mode\":\"HTML\",\"text\":$(echo "$1" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" > /dev/null 2>&1
          }

          node index.js > /tmp/bot.log 2>&1 &
          BOT_PID=$!

          sleep 30

          if ! kill -0 $BOT_PID 2>/dev/null; then
            echo "=== BOT CRASHED - FULL LOG ==="
            cat /tmp/bot.log
            echo "=== END LOG ==="
            tg_json "❌ <b>Bot failed to start!</b>&#10;<code>$(tail -50 /tmp/bot.log | head -c 3500)</code>"
            exit 1
          fi

          EARLY_LOG=$(cat /tmp/bot.log | head -c 3000)
          MSG="🤖 <b>Bot Discord started</b>&#10;⏰ $(date '+%Y-%m-%d %H:%M:%S UTC')&#10;&#10;<code>$EARLY_LOG</code>"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"$TELEGRAM_CHAT_ID\",\"parse_mode\":\"HTML\",\"text\":$(echo "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" > /dev/null 2>&1

          LAST_LINE=$(wc -l < /tmp/bot.log)
          LAST_PING=$(date +%s)
          START_TIME=$(date +%s)
          MAX_DURATION=$((5 * 60 * 60 + 20 * 60))

          while true; do
            sleep 10

            NOW=$(date +%s)
            if [ $((NOW - START_TIME)) -ge $MAX_DURATION ]; then
              curl -s -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/huydepayqiu119-cpu/github-bot-discord/actions/workflows/run-bot.yml/dispatches \
                -d '{"ref":"main"}' > /dev/null 2>&1
              break
            fi

            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "=== BOT DIED - LAST LOG ==="
              tail -30 /tmp/bot.log
              tg_json "💀 <b>Bot process died!</b>&#10;<code>$(tail -30 /tmp/bot.log | head -c 3000)</code>"
              exit 1
            fi

            CURRENT_LINE=$(wc -l < /tmp/bot.log)
            if [ "$CURRENT_LINE" -gt "$LAST_LINE" ]; then
              NEW_LINES=$(sed -n "$((LAST_LINE + 1)),${CURRENT_LINE}p" /tmp/bot.log)
              LAST_LINE=$CURRENT_LINE
              tg_json "<code>$(echo "$NEW_LINES" | head -c 3500)</code>"
            fi

            if [ $((NOW - LAST_PING)) -ge 1800 ]; then
              UPTIME=$(ps -p $BOT_PID -o etime= 2>/dev/null || echo "unknown")
              tg_json "💓 <b>Bot still running</b>&#10;Uptime: $UPTIME"
              LAST_PING=$NOW
            fi
          done
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_TOKEN: ${{ secrets.BOTDISCORD }}
          GITHUB_OWNER: huydepayqiu119-cpu
          GITHUB_REPO: bot-discord
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
